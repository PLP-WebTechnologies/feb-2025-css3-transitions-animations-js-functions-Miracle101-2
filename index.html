<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated App with Local Storage</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>

  <header>
    <h1 id="welcomeText">Welcome Back!</h1>
  </header>

  <section>
    <label for="themeSelect">Choose your theme:</label>
    <select id="themeSelect">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
    <button id="saveBtn">Save Preference</button>
  </section>

  <section>
    <img id="rocket" src="https://cdn-icons-png.flaticon.com/512/3215/3215233.png" alt="Rocket" />
    <button id="launchBtn">Launch Rocket 🚀</button>
  </section>

</body>
</html>
